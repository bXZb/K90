# REDMI K90 (annibale) — AOSP GKI 6.6.77 + SukiSU + SUSFS
#
# 顺序与 BUILD-K90-GKI.md 第 3.2 节一致：00→01→02→03→04→05→06→07。不要编 16K。
# 标准 GitHub-hosted runner（约 4 核 / 16GB）用 BUILD_JOBS=3、LTO=thin，和手册一致。
# 磁盘：endersonmenezes/free-disk-space@v3（已验证清完约 55G）。
# 不要用 maximize-build-space：这台镜像没有独立 /mnt，LVM 会把根分区吃光。

name: Build K90 GKI

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "GitHub-hosted 镜像，或自建 runner 标签（如 self-hosted）"
        type: string
        default: ubuntu-22.04
      lto:
        description: "LTO（thin = 已验证配置；none = 更快、仅调试）"
        type: choice
        default: thin
        options:
          - thin
          - none
      jobs:
        description: "bazel --jobs（auto = 按 CPU/内存估算）"
        type: string
        default: auto
      ksu:
        description: "KernelSU 变体（builtin = 已验证默认；main = 官方 tag，默认 v4.2.0）"
        type: choice
        default: builtin
        options:
          - builtin
          - main
      ksu_tag:
        description: "仅 ksu=main：SukiSU-Ultra 的 git tag 或 commit（空 = v4.2.0）"
        type: string
        default: v4.2.0
      create_release:
        description: "构建成功后发布 GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "scripts/**"
      - "configs/**"
      - ".github/workflows/build-gki.yml"
      - ".github/actions/**"

concurrency:
  group: k90-gki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  GKI_MANIFEST_BRANCH: common-android15-6.6
  GKI_KERNEL_TAG: android15-6.6-2025-03_r15
  EXPECTED_UNAME: 6.6.77-android15-8-g4a507830d890-4k

jobs:
  build:
    name: aosp-release 4K
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 360
    env:
      LTO: ${{ github.event.inputs.lto || 'thin' }}
      BUILD_JOBS: ${{ github.event.inputs.jobs || 'auto' }}
      KSU_FLAVOR: ${{ github.event.inputs.ksu || 'builtin' }}
      KSU_TAG: ${{ github.event.inputs.ksu_tag || 'v4.2.0' }}

    steps:
      - name: Checkout seed
        uses: actions/checkout@v4

      - name: Build environment setup
        uses: ./.github/actions/gki-setup
        with:
          free_disk: ${{ startsWith(github.event.inputs.runner || 'ubuntu-22.04', 'ubuntu-') }}

      - name: Sync AOSP GKI (01)
        run: bash scripts/01-sync-aosp-gki.sh

      - name: Apply SukiSU (02)
        run: bash scripts/02-apply-sukisu.sh

      - name: Apply SUSFS (03)
        run: bash scripts/03-apply-susfs.sh

      - name: Apply ShirkNeko defaults (04)
        run: bash scripts/04-apply-shirkneko-defaults.sh

      - name: Build GKI (05)
        run: bash scripts/05-build-gki.sh

      - name: Pack AnyKernel3 (06)
        run: bash scripts/06-pack-anykernel.sh

      - name: Patch KPM Image (07)
        run: bash scripts/07-patch-kpm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.ksu == 'main' && format('SukiSU-{0}-annibale-aosp-6.6.77-4k-SUSFS-REL-', github.event.inputs.ksu_tag || 'v4.2.0') || 'SukiSU-annibale-aosp-6.6.77-4k-SUSFS-REL-' }}${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/aosp-release/boot-lz4.img
            out/aosp-release/boot-gz.img
            out/aosp-release/boot.img
            out/aosp-release/Image
            out/aosp-release/Image.gz
            out/aosp-release/Image.lz4
            out/aosp-release/Image-kpm
            out/aosp-release/boot-kpm.img
            out/aosp-release/System.map
            out/SukiSU*-annibale-aosp-*-4k-SUSFS-REL-AnyKernel3.zip
            out/SukiSU*-annibale-aosp-*-4k-SUSFS-REL-KPM-AnyKernel3.zip

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ci-{0}', github.run_number) }}
          name: K90 GKI ${{ env.EXPECTED_UNAME }} (${{ github.ref_type == 'tag' && github.ref_name || format('run {0}', github.run_number) }})
          generate_release_notes: true
          body: |
            REDMI K90 (`annibale`) AOSP GKI **${{ env.EXPECTED_UNAME }}**
            + 内置 SukiSU/KPM + SUSFS + `RFKILL=y`。
            ${{ github.event.inputs.ksu == 'main' && format('\n> ⚠️ 变体：SukiSU 官方 tag `{0}`（驱动无 SUSFS 菜单，未经真机验证）\n', github.event.inputs.ksu_tag || 'v4.2.0') || '' }}

            优先临时启动（已验证路径）：

            ```
            fastboot boot boot.img
            fastboot boot boot-kpm.img
            ```

            不要刷 `system_dlkm*.img`。不要用 16K / 网上通用 GKI。不要 `fastboot boot` `*-lz4.img`。
          files: |
            out/aosp-release/boot.img
            out/aosp-release/boot-kpm.img
            out/SukiSU*-annibale-aosp-*-4k-SUSFS-REL-AnyKernel3.zip
            out/SukiSU*-annibale-aosp-*-4k-SUSFS-REL-KPM-AnyKernel3.zip
